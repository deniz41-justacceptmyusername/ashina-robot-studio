name: Bug report
description: Report a reproducible simulator problem
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Application version and Windows version
      placeholder: "0.4.4 / Windows 11"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Session mode
      options:
        - Standalone
        - WPILib / NetworkTables
        - Blockly
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected behavior
      description: Include season, mechanism, and relevant settings.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and useful evidence
      description: Attach a small example or log with personal paths and secrets removed.
    validations:
      required: true
